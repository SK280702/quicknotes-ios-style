name: Test, build, and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quicknotes-release
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model and UI tests
        run: |
          npm ci
          npm test
          npx playwright install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification
          path: build/QuickNotes-*.png
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build app and native test APKs
        run: |
          ./build.sh
          ./tests/android/build.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 alarm and deletion confirmation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install dist/QuickNotes-v1.6.0.apk
            adb install build/native-tests.apk
            adb shell pm grant com.quicknotes.app android.permission.POST_NOTIFICATIONS
            adb shell appops set com.quicknotes.app SCHEDULE_EXACT_ALARM allow
            adb shell appops set com.quicknotes.app USE_FULL_SCREEN_INTENT allow
            adb logcat -c
            adb shell am instrument -w com.quicknotes.app.tests/com.quicknotes.app.NativeTests | tee build/native-tests.txt
            adb logcat -d > build/native-logcat.txt
            adb shell dumpsys alarm > build/native-alarms.txt
            python3 -c "from pathlib import Path; assert 'Native alarm and confirmation tests passed' in Path('build/native-tests.txt').read_text()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-verification
          path: build/native-*.txt
  release:
    needs: [native, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile source and verify APK
        run: |
          ./build.sh
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/QuickNotes-v1.6.0.apk
          python3 tests/check_release.py
      - name: Prepare assets
        run: |
          cp release/QuickNotes-v1.6.0.apk dist/QuickNotes-v1.6.0.apk
          git archive --format=zip --prefix=QuickNotes/ HEAD -o dist/QuickNotes-source-v1.6.0.zip
          cp spec.md dist/spec.md
          cd dist
          sha256sum QuickNotes-v1.6.0.apk QuickNotes-source-v1.6.0.zip spec.md > SHA256SUMS
      - name: Publish release from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.6.0 >/dev/null 2>&1; then
            gh release create v1.6.0 --target "$GITHUB_SHA" --title 'QuickNotes 1.6.0' --notes-file release-notes.md
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.6.0" -f sha="$GITHUB_SHA" -F force=true
          fi
          gh release upload v1.6.0 dist/QuickNotes-v1.6.0.apk dist/QuickNotes-source-v1.6.0.zip dist/spec.md dist/SHA256SUMS --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            build/QuickNotes-*.png
            dist/*
