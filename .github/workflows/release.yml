name: Test, build, and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Model tests
        run: npm test
      - name: Install UI test runner
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: UI tests
        run: npm run test:ui
      - name: Compile source and verify APK
        run: |
          ./build.sh
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/QuickNotes-v1.0.0.apk
          python3 tests/check_release.py
      - name: Prepare assets
        run: |
          cp release/QuickNotes-v1.0.0.apk dist/QuickNotes-v1.0.0.apk
          git archive --format=zip --prefix=QuickNotes/ HEAD -o dist/QuickNotes-source-v1.0.0.zip
          cp spec.md dist/spec.md
          cd dist
          sha256sum QuickNotes-v1.0.0.apk QuickNotes-source-v1.0.0.zip spec.md > SHA256SUMS
      - name: Publish release from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 --target "$GITHUB_SHA" --title 'QuickNotes 1.0.0' --notes-file release-notes.md
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0" -f sha="$GITHUB_SHA" -F force=true
          fi
          gh release upload v1.0.0 dist/QuickNotes-v1.0.0.apk dist/QuickNotes-source-v1.0.0.zip dist/spec.md dist/SHA256SUMS --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            build/QuickNotes-*.png
            dist/*
