<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;font:16px sans-serif}#map{height:calc(100% - 125px)}.bar{padding:12px;background:#f2f2f7;height:101px}button{padding:8px 16px;background:#007aff;border:0;border-radius:8px;color:white}input{width:100%}#error{color:#b00}</style></head><body><div id="map"></div><div class="bar"><label>Distance: <span id="label"></span><input id="radius" type="range" min="100.584" max="241401.6" step="any"></label><button onclick="select()">Use this location</button><span id="error"></span></div><script>
const config=__CONFIG__;let map,circle;const slider=document.getElementById('radius');slider.value=config.radius;
function update(){const radius=+slider.value;document.getElementById('label').textContent=radius<1609.344?Math.round(radius*3.28084)+' ft':(radius/1609.344).toFixed(1)+' miles';if(circle){circle.setRadius(radius);map.fitBounds(circle.getBounds());}}
slider.oninput=update;update();window.gm_authFailure=()=>document.getElementById('error').textContent='Maps key was rejected. Check key/API restrictions in Settings.';
function initMap(){map=new google.maps.Map(document.getElementById('map'),{center:{lat:config.lat,lng:config.lng},zoom:14,streetViewControl:false,mapTypeControl:false});circle=new google.maps.Circle({map,center:map.getCenter(),radius:+slider.value,strokeColor:'#007aff',strokeOpacity:1,strokeWeight:2,fillColor:'#007aff',fillOpacity:.22,draggable:true});map.addListener('click',e=>circle.setCenter(e.latLng));circle.addListener('center_changed',()=>map.panTo(circle.getCenter()));update();if(config.address)new google.maps.Geocoder().geocode({address:config.address},(results,status)=>{if(status==='OK'){circle.setCenter(results[0].geometry.location);config.address=results[0].formatted_address;update();}else document.getElementById('error').textContent='Address not found. Tap the map to choose a point.';});}
function select(){if(!circle){document.getElementById('error').textContent='Wait for the map to load.';return;}const center=circle.getCenter();location.href='quicknotes-map://picked?lat='+center.lat()+'&lng='+center.lng()+'&radius='+slider.value+'&address='+encodeURIComponent(config.address||'Selected location');}
</script><script src="https://maps.googleapis.com/maps/api/js?key=__KEY__&callback=initMap" async defer onerror="document.getElementById('error').textContent='Unable to load Google Maps. Check internet access.'"></script></body></html>
